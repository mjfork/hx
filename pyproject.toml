[project]
name = "hx"
version = "0.1.0"
description = "Routes trk asks to the right Claude Code session in herdr, and runs each work item in its own Space"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26"]
license = {file = "LICENSE"}
authors = [{name = "Michael Fork"}]

[project.urls]
Repository = "https://github.com/mjfork/hx"

[project.scripts]
hx = "hx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hx"]

# Writes hx/_build.py into the wheel: the commit a --no-editable copy was built from, for `hx --version`
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
